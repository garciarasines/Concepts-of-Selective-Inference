name: Generate Figure 1.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'Figures/Chapter-1/figure-1-1-winners.R'
      - 'Figures/theme.R'
      - '.github/workflows/generate-fig-1-1.yml'

jobs:
  generate-figure-1-1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('ggplot2'), repos='https://cloud.r-project.org')"

      - name: Generate Figure 1.1
        run: |
          Rscript Figures/Chapter-1/figure-1-1-winners.R

      - name: Upload figure artifact
        uses: actions/upload-artifact@v4
        with:
          name: figure-1-1-winners
          path: Figures/Chapter-1/winners.pdf
