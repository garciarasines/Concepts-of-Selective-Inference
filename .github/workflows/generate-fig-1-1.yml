name: Generate Figure 1.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-fig-1-1
  cancel-in-progress: false

jobs:
  generate-figure-1-1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('ggplot2'), repos='https://cloud.r-project.org')"

      - name: Generate Figure 1.1
        run: |
          Rscript Figures/Chapter-1/figure-1-1-winners.R

      - name: Copy figure to shared generated directory
        run: |
          mkdir -p Figures/Generated
          cp Figures/Chapter-1/winners.pdf Figures/Generated/figure-1-1-winners.pdf

      - name: Commit and push generated figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Figures/Generated/figure-1-1-winners.pdf

          if git diff --staged --quiet; then
            echo "No figure changes to commit."
            exit 0
          fi

          git commit -m "chore: update generated figure 1.1 [skip ci]"

          # Reduce push conflicts by rebasing on latest remote branch first
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
