name: Generate fig-1-1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-figure-1-1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('ggplot2'), repos='https://cloud.r-project.org')"

      - name: Generate fig-1-1
        run: |
          Rscript Figures/Chapter-1/fig-1-1.R

      - name: Copy figure to shared generated directory
        run: |
          mkdir -p Figures/Generated
          cp Figures/Chapter-1/fig-1-1.pdf Figures/Generated/fig-1-1.pdf

      - name: Commit generated figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Figures/Generated/fig-1-1.pdf
          if git diff --staged --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "chore: update generated fig-1-1"
            git push
          fi
